<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGRH — Relatório Compartilhado de Demandas & Visitas</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#667085;--bd:#d9dee5;--pri:#0b5cab;--pt:#fff;--red:#d00000;--ok:#1b2430;--hd:#e8eef6;--warn:#b45309;--warnbg:#fef3c7;--grn:#15803d;--grnbg:#dcfce7}
:root[data-t="d"]{--bg:#10151c;--card:#18202a;--tx:#e6ebf1;--mut:#97a3b3;--bd:#2c3744;--pri:#4d9be6;--pt:#08121e;--red:#ff6b6b;--ok:#e6ebf1;--hd:#1f2a37;--warn:#fbbf24;--warnbg:#451a03;--grn:#4ade80;--grnbg:#052e16}
@media (prefers-color-scheme:dark){:root:not([data-t]){--bg:#10151c;--card:#18202a;--tx:#e6ebf1;--mut:#97a3b3;--bd:#2c3744;--pri:#4d9be6;--pt:#08121e;--red:#ff6b6b;--ok:#e6ebf1;--hd:#1f2a37;--warn:#fbbf24;--warnbg:#451a03;--grn:#4ade80;--grnbg:#052e16}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
h1{font-size:16px;margin:0 auto 0 0}
button,select,input{font:inherit;color:var(--tx)}
button,select{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--pri)}
.on{background:var(--pri)!important;color:var(--pt)!important;border-color:var(--pri)!important}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tabs button{border-radius:0;font-weight:600}.tabs button:first-child{border-radius:6px 0 0 6px}.tabs button:last-child{border-radius:0 6px 6px 0}
.days{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.d{min-width:36px;padding:5px 0;text-align:center;position:relative}
.d.has::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.meta{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
input[type=text],input:not([type]),input[type=tel]{border:1px solid var(--bd);border-radius:6px;padding:6px 8px;background:var(--bg);width:100%}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:0}
.meta label{flex:1;min-width:240px}
.leg,.tip{color:var(--mut);font-size:12px}.r{color:var(--red)}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:14px;overflow:hidden}
.sec h2{margin:0;padding:8px 12px;font-size:13px;letter-spacing:.04em;background:var(--hd);display:flex;align-items:center;gap:8px}
.sec h2 span{color:var(--mut);font-weight:400}.sec h2 button{margin-left:auto}
.empty{padding:10px 12px;color:var(--mut)}
.rec{margin:10px;padding:10px;border:1px solid var(--bd);border-left:5px solid var(--ok);border-radius:8px;background:var(--bg)}
.rec.a{border-left-color:var(--red)}
.rh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}.rh .x{margin-left:auto}
.sg button{border-radius:0}.sg button:first-child{border-radius:6px 0 0 6px}.sg button:last-child{border-radius:0 6px 6px 0}
.rec.a .sg .on{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.g label,.fh{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}.g label input{display:block;margin-top:2px;text-transform:none;font-size:14px}
.g .w{grid-column:span 2}
.in-row{display:flex;gap:4px;align-items:center;margin-top:2px}
.in-row input{margin-top:0!important}
.now-btn{padding:5px 7px;font-size:12px;flex-shrink:0;background:var(--card)}
.badge-warn{background:var(--warnbg);color:var(--warn);font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.badge-ok{background:var(--grnbg);color:var(--grn);font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.fm{margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd)}
.fr{display:grid;grid-template-columns:160px 2fr 1fr 1fr auto;gap:6px;margin:5px 0}
.vr{display:grid;grid-template-columns:2fr 150px 1fr 1fr 84px 84px auto;gap:6px;margin:5px 0;align-items:center}
.rec.a .g input{color:var(--red)}
.x{color:var(--mut)}.x:hover{color:var(--red)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kp div,.cd{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}.kp b{display:block;font-size:24px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.cd h3{margin:0 0 8px;font-size:13px}
.br{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;margin:4px 0;font-size:12px}.br i{display:block;height:12px;background:var(--pri);border-radius:3px;min-width:2px}.br b{text-align:right}
.vol{display:flex;align-items:flex-end;gap:2px;height:110px}.vol i{flex:1;background:var(--pri);border-radius:2px 2px 0 0;min-height:1px}.vl{display:flex;gap:2px;font-size:9px;color:var(--mut)}.vl span{flex:1;text-align:center}
.pl{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}.pl h3{margin:0}.pl h4{margin:12px 0 4px;font-size:12px}
.pl table{width:100%;border-collapse:collapse;font-size:12px}.pl th,.pl td{border:1px solid var(--bd);padding:4px 6px;text-align:left;vertical-align:top}.pl tr.a td{color:var(--red)}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);max-width:560px;width:92%}dialog::backdrop{background:#0008}
.res{max-height:50vh;overflow:auto}.res div{padding:6px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:9}#toast.s{opacity:1}
@media(max-width:780px){.fr,.vr{grid-template-columns:1fr 1fr}.g .w{grid-column:auto}}
@media print{header,.bar,.days,.tabs,.sec button,.rh button,.fm button,.fr .x,.vr .x,.now-btn{display:none!important}body{background:#fff;color:#000}.rec,.sec,.pl{break-inside:avoid}.pl,.sec{border-color:#999}#v-op .meta{display:flex!important}#colab{border:0;background:transparent}}
#aviso{border-color:var(--red)}#aviso span{flex:1;min-width:220px}.bk{width:100%;border-collapse:collapse}.bk td,.bk th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}.ok{color:#198754}
.pi{cursor:pointer;margin:6px 0}.pi:hover{border-color:var(--pri)}.chip{display:inline-block;background:var(--hd);border-radius:12px;padding:2px 10px;margin:2px 4px 2px 0;font-size:12px}.ev{margin:8px 0;padding:10px;border:1px solid var(--bd);border-left:5px solid var(--ok);border-radius:8px;background:var(--card)}.ev.a{border-left-color:var(--red)}.ev.a .st1{color:var(--red)}.ev .f span{margin-right:16px;display:inline-block}.ev .rh{margin-bottom:4px;flex-wrap:wrap}
#bkDir{font-weight:600}
@media print{#v-pac .meta,[data-pa]{display:none!important}.ev{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>🏥 SGRH — Relatório Compartilhado de Demandas</h1>
  <button id="bBusca">🔍 Buscar</button><button id="bXlsx">📥 Importar planilha</button><button id="bBk">💾 Backup</button><button id="bCsv">📄 CSV do mês</button><button id="bPrint">🖨️ Imprimir</button><button id="bTema">🌓</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <input type="file" id="fileXlsx" accept=".xlsx" hidden>
</header>
<main>
  <div class="meta" id="aviso" hidden></div>
  <div class="bar tabs" id="tabs">
    <button data-v="op">📝 Operacional</button>
    <button data-v="vis">🪪 Controle de Visitas</button>
    <button data-v="dash">📊 Painel do mês</button>
    <button data-v="pac">🧑‍⚕️ Paciente</button>
    <button data-v="pl">🖨️ Passagem de plantão</button>
  </div>
  <div class="bar" id="nav"><label>Mês <select id="mes"></select></label><label>Ano <select id="ano"></select></label><span class="tip" id="info"></span></div>
  <div class="days" id="days"></div>

  <div class="v" id="v-op">
    <div class="bar">
      <div class="tabs" id="turno"><button data-t="SD">☀️ Diurno (SD)</button><button data-t="SN">🌙 Noturno (SN)</button></div>
      <label>Setor <select id="fltSetorOp">
        <option value="">Todos os setores</option>
        <option value="001 - POSTO A">001 - POSTO A</option>
        <option value="002 - POSTO B">002 - POSTO B</option>
        <option value="003 - POSTO C">003 - POSTO C</option>
        <option value="004 - POSTO E">004 - POSTO E</option>
        <option value="005 - UTI 1">005 - UTI 1</option>
        <option value="006 - UTI 2">006 - UTI 2</option>
      </select></label>
      <label>Mostrar <select id="flt"><option value="">Todas</option><option value="a">Só agendadas</option><option value="r">Só realizadas</option></select></label>
      <button id="bPullPend" title="Importa para este turno as demandas agendadas (vermelhas) do turno anterior">📥 Puxar agendadas pendentes</button>
      <span class="leg"><b class="r">Vermelho = agendada</b> · Preto = realizada</span>
    </div>
    <div class="meta"><b id="titDia"></b><label>Colaboradores do turno <input id="colab" placeholder="Ex.: MARISTELA / DELIS"></label><span id="kpiDia" class="tip"></span></div>
    <div id="secs"></div>
  </div>

  <div class="v" id="v-vis" hidden>
    <div class="meta">
      <b id="titVis"></b>
      <span id="kpiVis" class="tip"></span>
      <button id="bPullPacVis" title="Cria cartões de visita a partir dos pacientes internados/admitidos hoje">📋 Importar pacientes do dia</button>
      <button class="on" id="bAddVis">+ Novo Paciente / Visita</button>
    </div>
    <div class="bar">
      <select id="fltSetorVis" aria-label="Filtrar por setor">
        <option value="">Todos os setores</option>
        <option value="001 - POSTO A">001 - POSTO A</option>
        <option value="002 - POSTO B">002 - POSTO B</option>
        <option value="003 - POSTO C">003 - POSTO C</option>
        <option value="004 - POSTO E">004 - POSTO E</option>
        <option value="005 - UTI 1">005 - UTI 1</option>
        <option value="006 - UTI 2">006 - UTI 2</option>
      </select>
      <input id="fltVis" placeholder="Filtrar visitas do dia por paciente, leito, visitante ou status (ex.: em andamento)..." style="max-width:420px;background:var(--card)">
    </div>
    <div id="visList"></div>
  </div>

  <div class="v" id="v-dash" hidden></div>
  <div class="v" id="v-pl" hidden></div>
  <div class="v" id="v-pac" hidden></div>
  <p class="tip"><b></b><b></b> </p>
</main>
<dialog id="dlg"><form method="dialog"><h3 style="margin-top:0">Buscar em todos os meses</h3><input id="q" placeholder="Paciente, leito, familiar, CPF, exame, visitante..."><div class="res" id="res"></div><p style="text-align:right"><button>Fechar</button></p></form></dialog>
<dialog id="dbk"><form method="dialog"><h3 style="margin-top:0">💾 Backup e segurança dos dados</h3><div id="bkbox"></div><p style="text-align:right"><button>Fechar</button></p></form></dialog>

<datalist id="dl-leitos">
  <option value="001 - POSTO A"><option value="002 - POSTO B"><option value="003 - POSTO C">
  <option value="004 - POSTO E"><option value="005 - UTI 1"><option value="006 - UTI 2">
  <option value="L.01 (001 - POSTO A)"><option value="L.02 (001 - POSTO A)"><option value="L.03 (001 - POSTO A)"><option value="L.04 (001 - POSTO A)"><option value="L.05 (001 - POSTO A)">
  <option value="L.06 (001 - POSTO A)"><option value="L.07 (001 - POSTO A)"><option value="L.08 (001 - POSTO A)"><option value="L.09 (001 - POSTO A)"><option value="L.10 (001 - POSTO A)">
  <option value="L.14 (002 - POSTO B)"><option value="L.17 (002 - POSTO B)">
  <option value="L.18 (003 - POSTO C)"><option value="L.19 (003 - POSTO C)">
  <option value="L.24 (004 - POSTO E)"><option value="L.28 (004 - POSTO E)"><option value="L.29 (004 - POSTO E)"><option value="L.33 (004 - POSTO E)">
  <option value="L.04 (005 - UTI 1)"><option value="L.08 (005 - UTI 1)"><option value="L.09 (005 - UTI 1)"><option value="L.10 (005 - UTI 1)">
  <option value="L.36 (006 - UTI 2)"><option value="L.39 (006 - UTI 2)">
</datalist>
<datalist id="dl-pacientes-dia"></datalist>

<div id="toast"></div>
<script>
const KEY='relatorio_demandas_v1';
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SECS=[
  ['adm','ADMISSÕES',['Paciente','Leito','Horário / Origem / CID']],
  ['alt','ALTAS',['Paciente','Leito','Horário']],
  ['tex','TRANSFERÊNCIAS EXTERNAS',['Paciente','Leito','Horário','Local de destino']],
  ['tin','TRANSFERÊNCIAS INTERNAS',['Paciente','Horário','Leito de origem','Leito de destino']],
  ['obi','ÓBITO',['Paciente','Leito','Horário']],
  ['exa','EXAMES / PROCEDIMENTOS',['Paciente','Leito','Saída','Retorno','Exame / Procedimento']],
  ['dem','DEMANDAS EXTRAS',['Paciente','Leito','Horário','Demanda realizada']]
];
const OLD={adm:5,alt:5,tex:6,tin:6,obi:5,exa:7,dem:6};
const PAR=['Pai','Mãe','Filho(a)','Esposo(a)','Irmão(ã)','Neto(a)','Avô/Avó','Tio(a)','Sobrinho(a)','Primo(a)','Genro/Nora','Cunhado(a)','Amigo(a)','Vizinho(a)','Cuidador(a)','Responsável legal','Advogado(a)','Visita religiosa','Profissional de saúde','Outro','Sem acompanhante','Desceu sozinho'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const p2=n=>String(n).padStart(2,'0');
const NF=()=>({p:'',n:'',c:'',t:''});
const NV=()=>({n:'',p:'',c:'',cracha:'',in:'',out:''});
const nowHHMM=()=>{const d=new Date();return `${p2(d.getHours())}:${p2(d.getMinutes())}`};

function mig(d){
  for(const m of Object.values(d)){
    for(const dia of Object.values(m)){
      if(dia.visitas && !Array.isArray(dia.visitas)) dia.visitas=[];
      for(const [k,b] of Object.entries(dia)){
        if(k==='visitas') continue;
        for(const [sk,rows] of Object.entries(b.secs||{})){
          for(const r of rows){
            if(!r.f){
              const n=r.v.length;
              if(n===OLD[sk]){const f=r.v[n-2]||'',t=r.v[n-1]||'';r.v=r.v.slice(0,n-2);r.f=(f||t)?[{p:'',n:f,c:'',t}]:[]}
              else r.f=[];
            } else if(r.v.length===OLD[sk]){
              r.v=r.v.slice(0,OLD[sk]-2);
            }
          }
        }
      }
    }
  }
}

let db={};try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){db={}}mig(db);
let meta={};try{meta=JSON.parse(localStorage.getItem(KEY+'_meta')||'{}')}catch(e){}meta.bk=meta.bk||{};meta.alt=meta.alt||{};
const hoje=new Date();
let st={v:'op',ano:hoje.getFullYear(),mes:hoje.getMonth()+1,dia:hoje.getDate(),turno:'SD',flt:'',fltSetorOp:'',fltVis:'',fltSetorVis:'',pq:'',pk:''},tmr;

function save(){
  meta.alt[mk()]=Date.now();
  clearTimeout(tmr);
  tmr=setTimeout(()=>{
    try{
      localStorage.setItem(KEY,JSON.stringify(db));
      localStorage.setItem(KEY+'_meta',JSON.stringify(meta));
    }catch(e){
      saveMeta();
      toast('⚠️ Armazenamento cheio! Salve um backup agora.');
    }
  },250);
  aviso();
}
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2600)}
const mk=(a=st.ano,m=st.mes)=>`${a}-${p2(m)}`,nd=(a,m)=>new Date(a,m,0).getDate();

function blk(c,t=st.turno,d=st.dia){
  let m=db[mk()];if(!m){if(!c)return null;m=db[mk()]={}}
  let x=m[d];if(!x){if(!c)return null;x=m[d]={}}
  let b=x[t];if(!b){if(!c)return null;b=x[t]={colab:'',secs:{}}}
  SECS.forEach(s=>{if(!b.secs[s[0]])b.secs[s[0]]=[]});
  return b;
}
function visList(c,d=st.dia){
  let m=db[mk()];if(!m){if(!c)return [];m=db[mk()]={}}
  let x=m[d];if(!x){if(!c)return [];x=m[d]={}}
  if(!Array.isArray(x.visitas)){if(!c)return [];x.visitas=[]}
  return x.visitas;
}

const vazia=r=>!r.v.some(Boolean)&&!(r.f||[]).some(f=>f.n||f.p||f.c||f.t);
const cnt=b=>b&&b.secs?Object.values(b.secs).reduce((a,rows)=>a+rows.filter(r=>!vazia(r)).length,0):0;
const cntVis=d=>{const x=(db[mk()]||{})[d];return x&&Array.isArray(x.visitas)?x.visitas.reduce((a,p)=>a+(p.v?p.v.filter(v=>v.n).length:0),0):0};
const tem=d=>{const x=(db[mk()]||{})[d];if(!x)return false;return ['SD','SN'].some(t=>cnt(x[t]))||(Array.isArray(x.visitas)&&x.visitas.length>0)};

const mcpf=s=>s.replace(/\D/g,'').slice(0,11).replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1-$2');
function mtel(s){if(/[^\d()\s-]/.test(s))return s;const d=s.replace(/\D/g,'');if(d.length>11)return s;return d.length>10?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length>6?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d}
const famTxt=f=>(f||[]).filter(x=>x.n||x.p||x.c||x.t).map(x=>[x.n,x.p&&`(${x.p})`,x.c&&'CPF '+x.c,x.t&&'☎ '+x.t].filter(Boolean).join(' ')).join(' | ');
const visTxt=v=>(v||[]).filter(x=>x.n).map(x=>[x.n,x.p&&`(${x.p})`,x.c&&'CPF '+x.c,x.cracha&&'Crachá/Tel:'+x.cracha,x.in&&'Ent:'+x.in,x.out&&'Saída:'+x.out].filter(Boolean).join(' ')).join(' | ');
const nrm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();

function getPatientsOfDay(d=st.dia){
  const map=new Map();
  const x=(db[mk()]||{})[d]||{};
  ['SD','SN'].forEach(t=>{
    const b=x[t];if(!b||!b.secs)return;
    SECS.forEach(([k])=>{
      (b.secs[k]||[]).forEach(r=>{
        const nome=(r.v[0]||'').trim();
        const key=nrm(nome);if(!key)return;
        const leito=k==='tin'?(r.v[3]||r.v[2]||''):(r.v[1]||'');
        const prev=map.get(key)||{nome,leito:'',fams:[]};
        if(leito) prev.leito=leito;
        if(r.f&&r.f.length) prev.fams=JSON.parse(JSON.stringify(r.f));
        map.set(key,prev);
      });
    });
  });
  (x.visitas||[]).forEach(p=>{
    const nome=(p.pac||'').trim();
    const key=nrm(nome);if(!key)return;
    const prev=map.get(key)||{nome,leito:'',fams:[]};
    if(p.leito) prev.leito=p.leito;
    map.set(key,prev);
  });
  return [...map.values()];
}
function refreshPatientDatalist(){
  const list=getPatientsOfDay();
  $('#dl-pacientes-dia').innerHTML=list.map(p=>`<option value="${esc(p.nome)}">${esc(p.leito)}</option>`).join('');
}

function init(){
  $('#mes').innerHTML=MESES.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');
  const ys=new Set([hoje.getFullYear()-1,hoje.getFullYear(),hoje.getFullYear()+1]);Object.keys(db).forEach(k=>ys.add(+k.slice(0,4)));
  $('#ano').innerHTML=[...ys].sort().map(y=>`<option>${y}</option>`).join('');render();
}
$('#mes').onchange=e=>{st.mes=+e.target.value;st.dia=Math.min(st.dia,nd(st.ano,st.mes));render()};
$('#ano').onchange=e=>{st.ano=+e.target.value;st.dia=Math.min(st.dia,nd(st.ano,st.mes));render()};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){st.v=b.dataset.v;render()}};
$('#turno').onclick=e=>{const b=e.target.closest('button');if(b){st.turno=b.dataset.t;render()}};
$('#flt').onchange=e=>{st.flt=e.target.value;render()};
$('#colab').oninput=e=>{blk(true).colab=e.target.value;save()};
$('#days').onclick=e=>{const b=e.target.closest('.d');if(b){st.dia=+b.dataset.d;render()}};

function render(){
  $('#mes').value=st.mes;
  if(![...$('#ano').options].some(o=>+o.value===st.ano))$('#ano').add(new Option(st.ano,st.ano));
  $('#ano').value=st.ano;
  document.querySelectorAll('.v').forEach(v=>v.hidden=v.id!=='v-'+st.v);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.v));
  $('.days').hidden=st.v==='dash'||st.v==='pac';
  $('#nav').hidden=st.v==='pac';
  let h='';for(let d=1;d<=nd(st.ano,st.mes);d++)h+=`<button class="d${d===st.dia?' on':''}${tem(d)?' has':''}" data-d="${d}">${d}</button>`;
  $('#days').innerHTML=h;
  const diasAtivos=Object.keys(db[mk()]||{}).filter(d=>tem(+d)).length;
  $('#info').textContent=`${diasAtivos} dia(s) com registros em ${MESES[st.mes-1]}/${st.ano}`;
  refreshPatientDatalist();
  aviso();
  if(st.v==='op')renderOp();
  else if(st.v==='vis')renderVis();
  else if(st.v==='dash')renderDash();
  else if(st.v==='pac')renderPac();
  else renderPl();
}
const dtxt=()=>`${p2(st.dia)}/${p2(st.mes)}/${st.ano}`;

function renderOp(){
  document.querySelectorAll('#turno button').forEach(b=>b.classList.toggle('on',b.dataset.t===st.turno));
  $('#flt').value=st.flt;
  const b=blk(false);
  $('#colab').value=b?b.colab:'';
  $('#titDia').textContent=`DIA ${dtxt()} (${new Date(st.ano,st.mes-1,st.dia).toLocaleDateString('pt-BR',{weekday:'long'})}) — TURNO ${st.turno}`;
  let a=0,r=0;if(b)Object.values(b.secs).forEach(x=>x.filter(v=>!vazia(v)).forEach(y=>y.s==='a'?a++:r++));
  $('#kpiDia').innerHTML=`<b class="r">${a} agendada(s)</b> · ${r} realizada(s)`;
  const box=$('#secs');box.innerHTML='';
  SECS.forEach(([k,t,labs])=>{
    const rows=b?b.secs[k]:[];
    const s=document.createElement('section');s.className='sec';
    let h=`<h2>${t} <span>(${rows.filter(r=>!vazia(r)).length})</span><button class="on" data-add="${k}">+ Adicionar</button></h2>`;
    if(!rows.length)h+='<div class="empty">Nenhum registro. Clique em “+ Adicionar”.</div>';
    rows.forEach((x,i)=>{
      if(st.flt&&x.s!==st.flt)return;
      if(st.fltSetorOp){
        const setorNome=st.fltSetorOp.replace(/^\d+\s*-\s*/,'');
        const leito=k==='tin'?(x.v[3]||x.v[2]||''):(x.v[1]||'');
        const lNrm=nrm(leito);
        if(!lNrm.includes(nrm(st.fltSetorOp)) && !lNrm.includes(nrm(setorNome))) return;
      }
      const aguardandoExame=(k==='exa' && x.v[2] && !x.v[3]);
      h+=`<div class="rec ${x.s}" data-k="${k}" data-i="${i}">
        <div class="rh">
          <b>#${i+1}</b>
          <span class="sg">
            <button data-act="s" data-v="a" class="${x.s==='a'?'on':''}">Agendada</button>
            <button data-act="s" data-v="r" class="${x.s==='r'?'on':''}">Realizada</button>
          </span>
          <button data-act="autofill" title="Preenche leito e familiares se o paciente já foi registrado hoje">⚡ Puxar dados do dia</button>
          <button data-act="hist" title="Ver todos os registros deste paciente">🧑‍⚕️ Histórico do paciente</button>
          ${aguardandoExame?'<span class="badge-warn">⏳ Aguardando retorno</span>':''}
          <button class="x" data-act="del">✕ Excluir</button>
        </div>
        <div class="g">${labs.map((l,j)=>{
          const isPac=j===0;
          const isLeito=l.toLowerCase().includes('leito');
          const isTime=/horário|saída|retorno/i.test(l) && k!=='adm';
          return `<label class="${j===0?'w':''}">${l}
            <div class="in-row">
              <input data-j="${j}" value="${esc(x.v[j])}" ${isPac?'list="dl-pacientes-dia"':''} ${isLeito?'list="dl-leitos"':''}>
              ${isTime?`<button type="button" class="now-btn" data-act="now" data-j="${j}" title="Hora atual">🕒</button>`:''}
            </div>
          </label>`;
        }).join('')}</div>
        <div class="fm">
          <div class="fh">Familiares / contatos</div>
          ${x.f.map((f,n)=>`<div class="fr" data-fi="${n}">
            <select data-fk="p" aria-label="Parentesco"><option value="">Parentesco…</option>${PAR.map(p=>`<option${p===f.p?' selected':''}>${p}</option>`).join('')}</select>
            <input data-fk="n" placeholder="Nome do familiar" value="${esc(f.n)}">
            <input data-fk="c" placeholder="CPF" inputmode="numeric" value="${esc(f.c)}">
            <input data-fk="t" type="tel" placeholder="Telefone" value="${esc(f.t)}">
            <button class="x" data-act="delf" title="Remover familiar">✕</button>
          </div>`).join('')}
          <button data-act="addf">+ Familiar</button>
        </div>
      </div>`;
    });
    s.innerHTML=h;box.appendChild(s);
  });
}

$('#secs').oninput=e=>{
  const t=e.target,rc=t.closest('.rec');if(!rc)return;
  const x=blk(true).secs[rc.dataset.k][+rc.dataset.i];
  if(t.dataset.j!==undefined){
    x.v[+t.dataset.j]=t.value;
    if(+t.dataset.j===0) refreshPatientDatalist();
  } else if(t.dataset.fk){
    let v=t.value;
    if(t.dataset.fk==='c'){v=mcpf(v);t.value=v}
    if(t.dataset.fk==='t'){v=mtel(v);t.value=v}
    x.f[+t.closest('.fr').dataset.fi][t.dataset.fk]=v;
  }
  save();
};

$('#secs').onclick=e=>{
  const ad=e.target.closest('[data-add]');
  if(ad){
    const k=ad.dataset.add;
    blk(true).secs[k].push({v:Array(SECS.find(s=>s[0]===k)[2].length).fill(''),s:'a',f:[NF()]});
    save();render();
    const l=document.querySelectorAll(`.rec[data-k="${k}"]`);
    if(l.length) l[l.length-1].querySelector('input').focus();
    return;
  }
  const bt=e.target.closest('[data-act]'),rc=e.target.closest('.rec');if(!bt||!rc)return;
  const k=rc.dataset.k,rows=blk(true).secs[k],i=+rc.dataset.i,x=rows[i],a=bt.dataset.act;
  if(a==='hist'){
    if(!nrm(x.v[0]))return toast('Preencha o nome do paciente primeiro');
    st.pq=x.v[0].trim();st.pk=nrm(x.v[0]);st.v='pac';render();return;
  }
  if(a==='s') x.s=bt.dataset.v;
  else if(a==='now'){ x.v[+bt.dataset.j]=nowHHMM(); }
  else if(a==='autofill'){
    const key=nrm(x.v[0]);
    if(!key){toast('Digite ou selecione o nome do paciente primeiro.');return}
    const found=getPatientsOfDay().find(p=>nrm(p.nome)===key);
    if(!found){toast('Paciente não encontrado em outros registros de hoje.');return}
    if(k==='tin'){ if(!x.v[3]) x.v[3]=found.leito; if(!x.v[2]) x.v[2]=found.leito; }
    else if(x.v.length>1 && !x.v[1]){ x.v[1]=found.leito; }
    if(found.fams && found.fams.length){ x.f=JSON.parse(JSON.stringify(found.fams)); }
    toast('Dados do paciente preenchidos ✔');
  }
  else if(a==='del'){if(!confirm('Excluir este registro?'))return;rows.splice(i,1)}
  else if(a==='addf') x.f.push(NF());
  else if(a==='delf') x.f.splice(+bt.closest('.fr').dataset.fi,1);
  save();render();
};

$('#bPullPend').onclick=()=>{
  let prevAno=st.ano,prevMes=st.mes,prevDia=st.dia,prevTurno='SD';
  if(st.turno==='SN'){
    prevTurno='SD';
  } else {
    prevTurno='SN';
    const dt=new Date(st.ano,st.mes-1,st.dia-1);
    prevAno=dt.getFullYear();prevMes=dt.getMonth()+1;prevDia=dt.getDate();
  }
  const prevBlk=((db[mk(prevAno,prevMes)]||{})[prevDia]||{})[prevTurno];
  if(!prevBlk||!prevBlk.secs){toast('Nenhuma pendência encontrada no turno anterior.');return}
  let copiados=0;
  const curBlk=blk(true);
  SECS.forEach(([k])=>{
    (prevBlk.secs[k]||[]).forEach(r=>{
      if(r.s==='a'){
        const dup=curBlk.secs[k].some(c=>nrm(c.v[0])===nrm(r.v[0]) && c.v[2]===r.v[2]);
        if(!dup){
          curBlk.secs[k].push(JSON.parse(JSON.stringify(r)));
          copiados++;
        }
      }
    });
  });
  if(copiados){save();render();toast(`${copiados} demanda(s) agendada(s) importada(s) ✔`)}
  else toast('Nenhuma nova pendência agendada no turno anterior.');
};

function renderVis(){
  $('#titVis').textContent=`CONTROLE DE VISITAS — DIA ${dtxt()}`;
  const list=visList(false);
  let totalVis=0,emCurso=0;
  list.forEach(p=>(p.v||[]).forEach(v=>{if(!v.n)return;totalVis++;if(v.in && !v.out)emCurso++}));
  $('#kpiVis').innerHTML=`<b>${list.length}</b> paciente(s) · <b>${totalVis}</b> visitante(s) · <span class="badge-warn">${emCurso} no leito agora</span>`;
  $('#fltVis').value=st.fltVis;

  const box=$('#visList');
  if(!list.length){
    box.innerHTML='<div class="sec"><div class="empty">Nenhum registro de visita neste dia. Clique em <b>+ Novo Paciente / Visita</b> ou <b>📋 Importar pacientes do dia</b>.</div></div>';
    return;
  }

  $('#fltSetorVis').value=st.fltSetorVis;
  const q=nrm(st.fltVis);
  const sVis=nrm(st.fltSetorVis);
  const sVisNome=sVis.replace(/^\d+\s*-\s*/,'');
  let h='';
  list.forEach((p,pi)=>{
    const leitoNrm=nrm(p.leito);
    if(sVis && !leitoNrm.includes(sVis) && !leitoNrm.includes(sVisNome)) return;
    const blob=nrm([p.pac,p.leito,p.obs,...(p.v||[]).map(v=>`${v.n} ${v.p} ${v.c} ${v.cracha} ${v.in&&!v.out?'em andamento':''}`)].join(' '));
    if(q && !blob.includes(q)) return;
    const ativos=(p.v||[]).filter(v=>v.n && v.in && !v.out).length;
    h+=`<div class="sec" data-pi="${pi}">
      <h2>
        <span>PACIENTE #${pi+1}</span>
        ${ativos?`<span class="badge-warn">${ativos} visitante(s) no leito</span>`:'<span class="badge-ok">Sem visitante ativo</span>'}
        <button data-vact="histp" title="Ver histórico completo deste paciente">🧑‍⚕️ Histórico</button>
        <button class="x" data-vact="delp" style="margin-left:auto">✕ Excluir paciente</button>
      </h2>
      <div style="padding:10px">
        <div class="g">
          <label class="w">Nome do Paciente<input data-pf="pac" list="dl-pacientes-dia" value="${esc(p.pac)}" placeholder="Nome do paciente internado"></label>
          <label>Leito / Setor<input data-pf="leito" list="dl-leitos" value="${esc(p.leito)}" placeholder="Ex.: 005 - UTI 1 / L.10"></label>
          <label>Observação / Restrição<input data-pf="obs" value="${esc(p.obs||'')}" placeholder="Ex.: Visita autorizada 15h-16h / Isolamento"></label>
        </div>
        <div class="fm">
          <div class="fh">Visitantes registrados (${(p.v||[]).length})</div>
          ${(p.v||[]).map((v,vi)=>`<div class="vr" data-vi="${vi}">
            <input data-vf="n" placeholder="Nome completo do visitante" value="${esc(v.n)}">
            <select data-vf="p"><option value="">Parentesco…</option>${PAR.map(pr=>`<option${pr===v.p?' selected':''}>${pr}</option>`).join('')}</select>
            <input data-vf="c" placeholder="CPF / Doc" inputmode="numeric" value="${esc(v.c)}">
            <input data-vf="cracha" placeholder="Crachá / Tel" value="${esc(v.cracha||v.t||'')}">
            <div class="in-row"><input data-vf="in" placeholder="Entrada" value="${esc(v.in)}"><button type="button" class="now-btn" data-vact="vin" title="Registrar entrada agora">🕒</button></div>
            <div class="in-row"><input data-vf="out" placeholder="Saída" value="${esc(v.out)}"><button type="button" class="now-btn" data-vact="vout" title="Registrar saída agora">🕒</button></div>
            <button class="x" data-vact="delv" title="Remover visitante">✕</button>
          </div>`).join('')}
          <button type="button" data-vact="addv" style="margin-top:4px">+ Adicionar Visitante</button>
        </div>
      </div>
    </div>`;
  });
  box.innerHTML=h||'<div class="sec"><div class="empty">Nenhuma visita corresponde ao filtro.</div></div>';
}

$('#fltSetorVis').onchange=e=>{st.fltSetorVis=e.target.value;renderVis()};
$('#fltSetorOp').onchange=e=>{st.fltSetorOp=e.target.value;renderOp()};
$('#bAddVis').onclick=()=>{
  visList(true).push({pac:'',leito:'',obs:'',v:[NV()]});
  save();render();
  const ins=document.querySelectorAll('#visList input[data-pf="pac"]');
  if(ins.length) ins[ins.length-1].focus();
};

$('#bPullPacVis').onclick=()=>{
  const pacs=getPatientsOfDay();
  if(!pacs.length){toast('Nenhum paciente registrado nos turnos SD/SN hoje.');return}
  const list=visList(true);
  let add=0;
  pacs.forEach(p=>{
    if(!list.some(x=>nrm(x.pac)===nrm(p.nome))){
      list.push({pac:p.nome,leito:p.leito,obs:'',v:[NV()]});
      add++;
    }
  });
  if(add){save();render();toast(`${add} paciente(s) importado(s) para controle de visitas ✔`)}
  else toast('Todos os pacientes do dia já estão na lista de visitas.');
};

$('#visList').oninput=e=>{
  const t=e.target,sec=t.closest('[data-pi]');if(!sec)return;
  const p=visList(true)[+sec.dataset.pi];
  if(t.dataset.pf){
    p[t.dataset.pf]=t.value;
    if(t.dataset.pf==='pac'){
      refreshPatientDatalist();
      const found=getPatientsOfDay().find(x=>nrm(x.nome)===nrm(t.value));
      if(found && found.leito && !p.leito){ p.leito=found.leito; renderVis(); }
    }
  } else if(t.dataset.vf){
    const v=p.v[+t.closest('[data-vi]').dataset.vi];
    let val=t.value;
    if(t.dataset.vf==='c'){val=mcpf(val);t.value=val}
    v[t.dataset.vf]=val;
  }
  save();
};

$('#visList').onclick=e=>{
  const bt=e.target.closest('[data-vact]'),sec=e.target.closest('[data-pi]');if(!bt||!sec)return;
  const list=visList(true),pi=+sec.dataset.pi,p=list[pi],act=bt.dataset.vact;
  if(act==='histp'){
    if(!nrm(p.pac))return toast('Preencha o nome do paciente primeiro');
    st.pq=p.pac.trim();st.pk=nrm(p.pac);st.v='pac';render();return;
  }
  if(act==='delp'){if(!confirm('Excluir este paciente e suas visitas?'))return;list.splice(pi,1)}
  else if(act==='addv'){p.v.push(NV())}
  else if(act==='delv'){p.v.splice(+bt.closest('[data-vi]').dataset.vi,1)}
  else if(act==='vin'){p.v[+bt.closest('[data-vi]').dataset.vi].in=nowHHMM()}
  else if(act==='vout'){p.v[+bt.closest('[data-vi]').dataset.vi].out=nowHHMM()}
  save();render();
};

function renderDash(){
  const m=db[mk()]||{};let tot=0,ag=0,re=0,dias=0,visTot=0;const cat={},sh={SD:0,SN:0},vol=[],col={};
  SECS.forEach(s=>cat[s[0]]=0);
  for(let d=1;d<=nd(st.ano,st.mes);d++){
    let c=0;
    const dayObj=m[d]||{};
    visTot+=cntVis(d);
    ['SD','SN'].forEach(t=>{
      const b=dayObj[t];if(!b)return;
      const n=cnt(b);c+=n;sh[t]+=n;
      for(const [k,rows] of Object.entries(b.secs||{})){
        const valid=rows.filter(r=>!vazia(r));
        cat[k]+=valid.length;
        valid.forEach(r=>r.s==='a'?ag++:re++);
      }
      if(n||b.colab)(b.colab||'').toUpperCase().split(/\s*(?:\/|,|;|&|\+|\sE\s|\s-\s)\s*/).map(x=>x.replace(/\(.*?\)|\bSD\b|\bSN\b/g,'').trim()).filter(Boolean).forEach(x=>col[x]=(col[x]||0)+1);
    });
    vol.push(c);tot+=c;if(c||cntVis(d))dias++;
  }
  const bar=(l,v,mx)=>`<div class="br"><span>${esc(l)}</span><i style="width:${mx?v/mx*100:0}%"></i><b>${v}</b></div>`;
  const mv=Math.max(...vol,1),mc=Math.max(...Object.values(cat),1),cl=Object.entries(col).sort((a,b)=>b[1]-a[1]);
  $('#v-dash').innerHTML=`<h3 style="margin-top:0">${MESES[st.mes-1]} de ${st.ano}</h3><div class="kp"><div>Total de registros<b>${tot}</b></div><div>Agendadas<b class="r">${ag}</b></div><div>Realizadas<b>${re}</b></div><div>Visitas registradas<b>${visTot}</b></div><div>Dias com registro<b>${dias}</b></div></div>
  <div class="cols"><div class="cd"><h3>Registros por categoria</h3>${SECS.map(s=>bar(s[1],cat[s[0]],mc)).join('')}</div>
  <div class="cd"><h3>Diurno × Noturno</h3>${bar('Diurno (SD)',sh.SD,Math.max(sh.SD,sh.SN,1))}${bar('Noturno (SN)',sh.SN,Math.max(sh.SD,sh.SN,1))}<h3 style="margin-top:14px">Plantões por colaborador</h3>${cl.map(([n,v])=>bar(n,v,cl[0][1])).join('')||'<span class="tip">Sem colaboradores informados.</span>'}</div>
  <div class="cd" style="grid-column:1/-1"><h3>Volume diário</h3><div class="vol">${vol.map((v,i)=>`<i style="height:${v/mv*100}%" title="Dia ${i+1}: ${v}"></i>`).join('')}</div><div class="vl">${vol.map((v,i)=>`<span>${i+1}</span>`).join('')}</div></div></div>`;
}

function renderPl(){
  let h=`<div class="bar"><button class="on" id="bCopyWa">📋 Copiar resumo para WhatsApp</button></div>`,any=false;
  ['SD','SN'].forEach(t=>{
    const b=blk(false,t);if(!b||(!cnt(b)&&!b.colab))return;any=true;
    h+=`<div class="pl"><h3>RELATÓRIO COMPARTILHADO — DIA ${dtxt()} — TURNO ${t}</h3><div class="tip">Colaboradores: <b>${esc(b.colab)||'—'}</b> · <span class="r">vermelho = agendada</span></div>`;
    SECS.forEach(([k,n,labs])=>{
      const rows=b.secs[k].filter(r=>!vazia(r));if(!rows.length)return;
      h+=`<h4>${n}</h4><table><tr>${labs.map(l=>`<th>${l}</th>`).join('')}<th>Familiares / contato</th></tr>${rows.map(r=>`<tr class="${r.s}">${labs.map((l,j)=>`<td>${esc(r.v[j])}</td>`).join('')}<td>${esc(famTxt(r.f))}</td></tr>`).join('')}</table>`;
    });
    h+='</div>';
  });
  const vis=visList(false);
  if(vis.length){
    any=true;
    h+=`<div class="pl"><h3>CONTROLE DE VISITAS — DIA ${dtxt()}</h3><table><tr><th>Paciente</th><th>Leito</th><th>Observação</th><th>Visitantes (Entrada / Saída)</th></tr>${vis.map(p=>`<tr><td>${esc(p.pac)}</td><td>${esc(p.leito)}</td><td>${esc(p.obs||'')}</td><td>${esc(visTxt(p.v))}</td></tr>`).join('')}</table></div>`;
  }
  $('#v-pl').innerHTML=any?h:`<div class="empty">Sem registros em ${dtxt()}.</div>`;
  const btnWa=$('#bCopyWa');
  if(btnWa) btnWa.onclick=copyWhatsApp;
}

function copyWhatsApp(){
  let out=[`*RELATÓRIO RECEPÇÃO — ${dtxt()}*`];
  ['SD','SN'].forEach(t=>{
    const b=blk(false,t);if(!b||(!cnt(b)&&!b.colab))return;
    out.push(`\n*TURNO ${t}* (${b.colab||'Equipe não informada'})`);
    SECS.forEach(([k,n])=>{
      const rows=b.secs[k].filter(r=>!vazia(r));if(!rows.length)return;
      out.push(`*${n}:*`);
      rows.forEach(r=>{
        const stTag=r.s==='a'?'[AGENDADA]':'[OK]';
        out.push(`• ${stTag} ${r.v.filter(Boolean).join(' | ')}`);
      });
    });
  });
  const vis=visList(false);
  if(vis.length){
    out.push(`\n*VISITAS DO DIA (${vis.length} paciente(s)):*`);
    vis.forEach(p=>out.push(`• ${p.pac} (${p.leito||'S/L'}): ${visTxt(p.v)||'Sem visitante'}`));
  }
  const txt=out.join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast('Resumo copiado para WhatsApp ✔')).catch(()=>prompt('Copie o texto abaixo:',txt));
}

/* ==================== PASTA DE BACKUP (File System Access API) ==================== */
const IDB_NAME='sgrh_fs';
const IDB_STORE='handles';
let bkDirHandle=null;

function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function idbGet(k){
  try{const d=await idbOpen();return await new Promise((res,rej)=>{
    const t=d.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k);
    t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);
  })}catch(e){return null}
}
async function idbSet(k,v){
  try{const d=await idbOpen();return await new Promise((res,rej)=>{
    const t=d.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(v,k);
    t.onsuccess=()=>res();t.onerror=()=>rej(t.error);
  })}catch(e){}
}
async function idbDel(k){
  try{const d=await idbOpen();return await new Promise((res,rej)=>{
    const t=d.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).delete(k);
    t.onsuccess=()=>res();t.onerror=()=>rej(t.error);
  })}catch(e){}
}

const fsSupported=()=>'showDirectoryPicker' in window;

async function loadDirHandle(){
  if(!fsSupported())return;
  const h=await idbGet('bkDir');
  if(h){ bkDirHandle=h; }
  updateDirLabel();
}
function updateDirLabel(){
  const el=$('#bkDir');if(!el)return;
  if(!fsSupported()){el.textContent='(navegador sem suporte — usando Downloads)';return}
  el.textContent=bkDirHandle?`✔ ${bkDirHandle.name}`:'(não definida — usando Downloads)';
}
async function ensureDirPermission(){
  if(!bkDirHandle)return false;
  let q=await bkDirHandle.queryPermission({mode:'readwrite'});
  if(q==='granted')return true;
  q=await bkDirHandle.requestPermission({mode:'readwrite'});
  return q==='granted';
}
async function chooseDir(){
  if(!fsSupported()){toast('Este navegador não permite escolher pasta. Use Chrome/Edge no desktop.');return}
  try{
    const h=await window.showDirectoryPicker({mode:'readwrite',id:'sgrh-bk'});
    bkDirHandle=h;
    await idbSet('bkDir',h);
    updateDirLabel();
    toast('Pasta de backup definida ✔');
  }catch(e){
    if(e.name!=='AbortError')toast('Não foi possível selecionar a pasta.');
  }
}
async function forgetDir(){
  if(!confirm('Esquecer a pasta de backup? Os próximos backups voltam a ser baixados em Downloads.'))return;
  bkDirHandle=null;
  await idbDel('bkDir');
  updateDirLabel();
  toast('Pasta esquecida.');
}

async function saveToDir(name,txt,type){
  if(!bkDirHandle)return false;
  if(!(await ensureDirPermission()))return false;
  try{
    const fh=await bkDirHandle.getFileHandle(name,{create:true});
    const w=await fh.createWritable();
    await w.write(new Blob([txt],{type}));
    await w.close();
    return true;
  }catch(e){
    toast('⚠️ Falha ao gravar na pasta: '+e.message);
    return false;
  }
}

function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

async function saveFile(name,txt,type){
  const ok=await saveToDir(name,txt,type);
  if(!ok) dl(name,txt,type);
  return ok;
}

const srt=(a,b)=>a.k.localeCompare(b.k)||a.d-b.d||a.t.localeCompare(b.t)||SECS.findIndex(s=>s[0]===a.sk)-SECS.findIndex(s=>s[0]===b.sk);
const fdd=(k,d)=>`${p2(d)}/${k.slice(5)}/${k.slice(0,4)}`;

function pacs(){
  const M=new Map();
  for(const [k,dias] of Object.entries(db)){
    for(const [d,tt] of Object.entries(dias)){
      for(const t of ['SD','SN']){
        const b=tt[t];if(!b||!b.secs)continue;
        for(const [sk,rows] of Object.entries(b.secs)){
          rows.forEach(r=>{
            const n=nrm(r.v[0]);if(!n||vazia(r))return;
            let p=M.get(n);
            if(!p){p={nome:r.v[0].trim(),regs:[]};M.set(n,p)}
            p.regs.push({k,d:+d,t,sk,r});
          });
        }
      }
      (tt.visitas||[]).forEach(vp=>{
        const n=nrm(vp.pac);if(!n)return;
        let p=M.get(n);
        if(!p){p={nome:vp.pac.trim(),regs:[]};M.set(n,p)}
        p.regs.push({k,d:+d,t:'VIS',sk:'vis',vp});
      });
    }
  }
  return M;
}

function leitos(p){
  const L=[];
  [...p.regs].sort(srt).forEach(x=>{
    if(x.sk==='vis'){
      const v=(x.vp.leito||'').trim();
      if(v && L[L.length-1]!==v) L.push(v);
      return;
    }
    SECS.find(s=>s[0]===x.sk)[2].forEach((l,j)=>{
      const v=(x.r.v[j]||'').trim();
      if(/leito/i.test(l)&&v&&L[L.length-1]!==v)L.push(v);
    });
  });
  return L;
}

function ficha(p){
  const R=[...p.regs].sort(srt),c={};
  R.forEach(x=>c[x.sk]=(c[x.sk]||0)+1);
  const L=leitos(p),a=R[0],z=R[R.length-1];
  const chips=SECS.filter(s=>c[s[0]]).map(s=>`<span class="chip">${s[1]}: <b>${c[s[0]]}</b></span>`).join('')+
    (c.vis?`<span class="chip">VISITAS: <b>${c.vis}</b></span>`:'');

  return `<div class="cd">
    <div class="rh">
      <h3 style="font-size:17px;margin:0">${esc(p.nome)}</h3>
      <button data-pa="back" style="margin-left:auto">← Nova busca</button>
      <button data-pa="print">🖨️ Imprimir</button>
    </div>
    <div class="tip">${R.length} registro(s) · de ${fdd(a.k,a.d)} a ${fdd(z.k,z.d)}</div>
    <div style="margin-top:6px">${chips}</div>
    ${L.length?`<div class="tip" style="margin-top:6px"><b>Leitos:</b> ${esc(L.join(' → '))}</div>`:''}
  </div>`+
  R.map(x=>{
    const diaSem=new Date(+x.k.slice(0,4),+x.k.slice(5)-1,x.d).toLocaleDateString('pt-BR',{weekday:'short'});
    if(x.sk==='vis'){
      const vp=x.vp;
      const f=`${vp.leito?`<span><b>Leito:</b> ${esc(vp.leito)}</span>`:''}${vp.obs?`<span><b>Obs.:</b> ${esc(vp.obs)}</span>`:''}`;
      const vt=visTxt(vp.v);
      return `<div class="ev r">
        <div class="rh">
          <b>${fdd(x.k,x.d)}</b>
          <span class="tip">${diaSem} · Portaria</span>
          <span class="chip">CONTROLE DE VISITAS</span>
          <span class="st1">${(vp.v||[]).filter(v=>v.n).length} visitante(s)</span>
          <button data-pa="open" data-k="${x.k}" data-d="${x.d}" data-t="VIS" style="margin-left:auto">Abrir no dia</button>
        </div>
        <div class="f">${f}</div>
        ${vt?`<div class="tip">🪪 ${esc(vt)}</div>`:''}
      </div>`;
    }
    const [,n,labs]=SECS.find(s=>s[0]===x.sk);
    const f=labs.map((l,j)=>j&&x.r.v[j]?`<span><b>${l}:</b> ${esc(x.r.v[j])}</span>`:'').join('');
    return `<div class="ev ${x.r.s}">
      <div class="rh">
        <b>${fdd(x.k,x.d)}</b>
        <span class="tip">${diaSem} · ${x.t==='SD'?'Diurno':'Noturno'}</span>
        <span class="chip">${n}</span>
        <span class="st1">${x.r.s==='a'?'Agendada':'Realizada'}</span>
        <button data-pa="open" data-k="${x.k}" data-d="${x.d}" data-t="${x.t}" style="margin-left:auto">Abrir no dia</button>
      </div>
      <div class="f">${f}</div>
      ${x.r.f.length?`<div class="tip">👪 ${esc(famTxt(x.r.f))}</div>`:''}
    </div>`;
  }).join('');
}

function pbox(){
  const M=pacs(),q=nrm(st.pq),toks=q.split(' ').filter(Boolean),box=$('#pbox');
  if(st.pk&&M.has(st.pk)){box.innerHTML=ficha(M.get(st.pk));return}
  if(q.length<2){box.innerHTML='<div class="empty">Digite o nome do paciente para ver todos os registros dele: admissões, transferências, exames, visitas, altas, óbito e demandas.</div>';return}
  const L=[...M.entries()].filter(([n])=>toks.every(t=>n.includes(t))).sort((a,b)=>b[1].regs.length-a[1].regs.length);
  if(L.length===1){box.innerHTML=ficha(L[0][1]);return}
  box.innerHTML=L.length?L.slice(0,60).map(([n,p])=>`<div class="cd pi" data-pk="${esc(n)}"><b>${esc(p.nome)}</b> <span class="tip">${p.regs.length} registro(s) · ${esc(leitos(p).slice(0,4).join(' → '))||'sem leito'}</span></div>`).join(''):'<div class="empty">Nenhum paciente encontrado. Tente apenas parte do nome.</div>';
}

/* ==================== IMPORTAÇÃO DE PLANILHA XLSX ==================== */

const SEC_MAP = {
  'ADMISSOES': 'adm',
  'ALTAS': 'alt',
  'TRANSFERENCIAS EXTERNAS': 'tex',
  'TRANSFERENCIAS INTERNAS': 'tin',
  'OBITO': 'obi',
  'EXAMES /PROCEDIMENTOS': 'exa',
  'DEMANDAS EXTRAS': 'dem'
};

const normTxt = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();

function isRed(cell) {
  if (!cell || !cell.s) return false;
  const c = cell.s.fgColor || cell.s.color;
  if (!c) return false;
  if (c.rgb) {
    const hex = c.rgb.replace('#','').toUpperCase();
    if (hex.length === 6) {
      const r = parseInt(hex.slice(0,2),16);
      const g = parseInt(hex.slice(2,4),16);
      const b = parseInt(hex.slice(4,6),16);
      return r >= 150 && g <= 100 && b <= 100;
    }
  }
  if (typeof c.indexed === 'number' && (c.indexed === 2 || c.indexed === 10)) return true;
  return false;
}

function cv(cell) {
  if (!cell) return '';
  let v = cell.v;
  if (v == null) return '';
  if (typeof v === 'number') {
    if (v > 0 && v < 1) {
      const totalMin = Math.round(v * 24 * 60);
      const hh = String(Math.floor(totalMin / 60)).padStart(2,'0');
      const mm = String(totalMin % 60).padStart(2,'0');
      return `${hh}:${mm}`;
    }
    return String(v);
  }
  return String(v).replace(/\r?\n/g,' ').trim();
}

function parseContato(familiar, contato) {
  let fam = (familiar || '').trim();
  let tel = (contato || '').trim();
  let full = [fam, tel].filter(Boolean).join(' ');
  if (!full) return null;

  let cpf = '';
  const mCpf = full.match(/(\d{3}\.?\d{3}\.?\d{3}-?\d{2})/);
  if (mCpf) { cpf = mCpf[1]; full = full.replace(mCpf[0], ' '); }

  let telefone = '';
  const mTel = full.match(/(\(?\d{2}\)?\s*\d{4,5}[-\s]?\d{4})/);
  if (mTel) { telefone = mTel[1]; full = full.replace(mTel[0], ' '); }

  let nome = full.replace(/\([^)]*\)/g, ' ').replace(/\s+/g,' ').trim();

  let parentesco = '';
  const mPar = (familiar || '').match(/\(([^)]+)\)/);
  if (mPar) parentesco = mPar[1].trim();

  return { p: parentesco, n: nome, c: cpf, t: telefone || tel };
}

function parseTurno(rows, startRow) {
  const blk = { colab: '', secs: { adm:[], alt:[], tex:[], tin:[], obi:[], exa:[], dem:[] } };
  let i = startRow;
  let secAtual = null;
  let headerRow = null;

  while (i < rows.length) {
    const row = rows[i] || [];
    const first = normTxt(cv(row[0]));

    if (first.startsWith('RELATORIO COMPARTILHADO')) break;

    // Colaboradores (procura em qualquer célula)
    for (let c = 0; c < row.length; c++) {
      const t = normTxt(cv(row[c]));
      if (t.startsWith('COLABORADORES')) {
        blk.colab = cv(row[c]).replace(/COLABORADORES\s*:?\s*/i,'').trim();
      }
    }

    if (SEC_MAP[first]) {
      secAtual = SEC_MAP[first];
      headerRow = null;
      i++; continue;
    }

    if (first === 'NOME DO PACIENTE') {
      headerRow = i;
      if (secAtual === 'exa') { i += 2; }
      else { i += 1; }
      continue;
    }

    if (secAtual && first && !first.startsWith('NOME DO PACIENTE')) {
      const paciente = cv(row[0]).trim();
      if (!paciente) { i++; continue; }
      if (/LEGENDA|ESCREVER DE|OBS:|PREENCHA/i.test(paciente)) { i++; continue; }

      let v = [];
      let status = isRed(row[0]) ? 'a' : 'r';

      if (secAtual === 'adm' || secAtual === 'alt' || secAtual === 'obi') {
        v = [paciente, cv(row[1]), cv(row[2])];
      } else if (secAtual === 'tex') {
        v = [paciente, cv(row[1]), cv(row[2]), cv(row[3])];
      } else if (secAtual === 'tin') {
        v = [paciente, cv(row[1]), cv(row[2]), cv(row[3])];
      } else if (secAtual === 'exa') {
        v = [paciente, cv(row[1]), cv(row[2]), cv(row[3]), cv(row[4])];
      } else if (secAtual === 'dem') {
        v = [paciente, cv(row[1]), cv(row[2]), cv(row[3])];
      }

      // Localiza colunas FAMILIAR / CONTATO no cabeçalho
      let colFam = -1, colCont = -1;
      if (headerRow != null) {
        const hdr = rows[headerRow] || [];
        const subHdr = rows[headerRow+1] || [];
        for (let c = 0; c < Math.max(hdr.length, subHdr.length); c++) {
          const ht = normTxt(cv(hdr[c]));
          if (ht === 'FAMILIAR') colFam = c;
          if (ht === 'CONTATO') colCont = c;
        }
      }
      if (colFam < 0) {
        if (secAtual === 'exa' || secAtual === 'dem') colFam = 5;
        else colFam = 4;
      }
      if (colCont < 0) colCont = 6;

      let familiar = cv(row[colFam]);
      let contato = cv(row[colCont]);
      if (!familiar && row[colFam-1]) familiar = cv(row[colFam-1]);

      const f = parseContato(familiar, contato);
      const fams = f ? [f] : [];

      blk.secs[secAtual].push({ v, s: status, f: fams });
      i++; continue;
    }

    i++;
  }

  return { blk, next: i };
}

function parseSheet(sheetName, rows) {
  let dia = null;
  const m = sheetName.match(/^(\d{1,2})\.(\d{1,2})$/);
  if (m) dia = parseInt(m[1], 10);

  if (!dia) {
    for (const row of rows.slice(0, 5)) {
      for (const cell of row) {
        const t = cv(cell);
        const md = t.match(/DIA:\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
        if (md) { dia = parseInt(md[1],10); break; }
      }
      if (dia) break;
    }
  }
  if (!dia) return null;

  let sdStart = -1, snStart = -1;
  for (let i = 0; i < rows.length; i++) {
    const t = normTxt(cv(rows[i][0]));
    if (t === 'TURNO: SD') sdStart = i;
    if (t === 'TURNO: SN') snStart = i;
  }

  let sd = null, sn = null;
  if (sdStart >= 0) {
    const end = snStart > sdStart ? snStart : rows.length;
    sd = parseTurno(rows.slice(0, end), sdStart);
    let colabSD = '';
    for (let k = Math.max(0, sdStart-4); k < sdStart; k++) {
      for (const c of (rows[k]||[])) {
        const t = cv(c);
        if (/COLABORADORES/i.test(t)) {
          colabSD = t.replace(/COLABORADORES\s*:?\s*/i,'').trim();
        }
      }
    }
    sd.blk.colab = colabSD || sd.blk.colab;
  }
  if (snStart >= 0) {
    sn = parseTurno(rows, snStart);
    let colabSN = '';
    for (let k = Math.max(0, snStart-4); k < snStart; k++) {
      for (const c of (rows[k]||[])) {
        const t = cv(c);
        if (/COLABORADORES/i.test(t)) {
          colabSN = t.replace(/COLABORADORES\s*:?\s*/i,'').trim();
        }
      }
    }
    sn.blk.colab = colabSN || sn.blk.colab;
  }

  return { dia, sd: sd?.blk, sn: sn?.blk };
}

async function importarXlsx(file) {
  if (typeof XLSX === 'undefined') {
    alert('Biblioteca SheetJS não carregada. Verifique a conexão ou hospede o xlsx.full.min.js localmente.');
    return;
  }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellStyles: true, cellDates: false });

  const fname = file.name.toLowerCase();
  const nomesMes = ['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  let mesDetectado = null;
  for (let i = 0; i < nomesMes.length; i++) {
    if (fname.includes(nomesMes[i])) { mesDetectado = i + 1; break; }
  }
  if (!mesDetectado) {
    for (const sn of wb.SheetNames) {
      const m = sn.match(/^\d{1,2}\.(\d{1,2})$/);
      if (m) { mesDetectado = parseInt(m[1],10); break; }
    }
  }

  const confirmMsg = `Arquivo: ${file.name}\nAbas: ${wb.SheetNames.join(', ')}\n\n` +
    `Mês detectado: ${mesDetectado ? MESES[mesDetectado-1] : '?'}\n` +
    `Ano atual no sistema: ${st.ano}\n\n` +
    `OK = importar (mescla com dados existentes)\nCancelar = abortar`;

  if (!confirm(confirmMsg)) return;

  let importados = 0;
  let diasImportados = [];

  for (const sheetName of wb.SheetNames) {
    const ws = wb.Sheets[sheetName];
    if (!ws) continue;

    const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
    const rowsCells = [];
    for (let R = range.s.r; R <= range.e.r; R++) {
      const rowArr = [];
      for (let C = range.s.c; C <= range.e.c; C++) {
        const addr = XLSX.utils.encode_cell({ r: R, c: C });
        rowArr.push(ws[addr] || null);
      }
      rowsCells.push(rowArr);
    }

    const parsed = parseSheet(sheetName, rowsCells);
    if (!parsed || !parsed.dia) continue;

    const k = `${st.ano}-${p2(mesDetectado || st.mes)}`;
    if (!db[k]) db[k] = {};
    const dayObj = db[k][parsed.dia] || (db[k][parsed.dia] = {});

    ['sd','sn'].forEach(tk => {
      const blk = parsed[tk];
      if (!blk) return;
      const turnoKey = tk.toUpperCase();
      const existente = dayObj[turnoKey] || (dayObj[turnoKey] = { colab: '', secs: {} });
      SECS.forEach(([sk]) => {
        if (!existente.secs[sk]) existente.secs[sk] = [];
        (blk.secs[sk] || []).forEach(novo => {
          const dup = existente.secs[sk].some(r =>
            nrm(r.v[0]) === nrm(novo.v[0]) && (r.v[2] || '') === (novo.v[2] || '')
          );
          if (!dup) { existente.secs[sk].push(novo); importados++; }
        });
      });
      if (blk.colab && !existente.colab) existente.colab = blk.colab;
    });

    diasImportados.push(parsed.dia);
  }

  save();
  render();
  toast(`${importados} registro(s) importado(s) em ${diasImportados.length} dia(s) ✔`);
}

$('#bXlsx').onclick = () => $('#fileXlsx').click();
$('#fileXlsx').onchange = e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) importarXlsx(f).catch(err => {
    console.error(err);
    alert('Erro ao importar planilha: ' + err.message);
  });
};

loadDirHandle();
init();
